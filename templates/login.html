<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | LorryGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚚 Lorry<span>Go</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

        <a href="{{ url_for('driver_register') }}">
            Driver
        </a>

    </div>

</nav>


<main class="form-page">

    <div class="form-card">

        <div class="hero-small">
            LORRYGO
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue your transportation journey.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        {% if message %}

        <div class="success-message">
            {{ message }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="main-button full-button"
            >
                Login to LorryGo
            </button>

        </form>


        <div class="form-footer">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Customer Account
            </a>

            <br><br>

            Want to drive a lorry?

            <a href="{{ url_for('driver_register') }}">
                Become a Driver
            </a>

        </div>

    </div>

</main>

</body>
</html>
