<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | LorryGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚚 Lorry<span>Go</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</nav>


<main class="form-page">

    <div class="form-card">

        <div class="hero-small">
            CUSTOMER ACCOUNT
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Create your LorryGo customer account
            and start booking lorries.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="main-button full-button"
            >
                Create Customer Account
            </button>

        </form>


        <div class="form-footer">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</main>

</body>
</html>
