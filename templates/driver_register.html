<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Registration | LorryGo</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚚 Lorry<span>Go</span>
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</nav>


<main class="form-page">

    <div class="form-card">

        <div class="hero-small">
            DRIVER NETWORK
        </div>

        <h1>
            Become a Driver
        </h1>

        <p>
            Register your lorry and start receiving
            transportation bookings.
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>
                    Driver Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter driver name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="hero-small"
                 style="margin-top:30px;">
                LORRY INFORMATION
            </div>


            <div class="form-group">

                <label>
                    Vehicle Number
                </label>

                <input
                    type="text"
                    name="vehicle_number"
                    placeholder="KA17AB1234"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Lorry Type
                </label>

                <select
                    name="lorry_type"
                    required
                >

                    <option value="">
                        Select lorry type
                    </option>

                    <option value="Mini Lorry">
                        Mini Lorry
                    </option>

                    <option value="Medium Lorry">
                        Medium Lorry
                    </option>

                    <option value="Heavy Lorry">
                        Heavy Lorry
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Capacity
                </label>

                <select
                    name="capacity"
                    required
                >

                    <option value="">
                        Select capacity
                    </option>

                    <option value="2 Ton">
                        2 Ton
                    </option>

                    <option value="5 Ton">
                        5 Ton
                    </option>

                    <option value="10 Ton">
                        10 Ton
                    </option>

                    <option value="15 Ton">
                        15 Ton
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="main-button full-button"
            >
                Register as Driver
            </button>

        </form>


        <div class="form-footer">

            Already registered?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</main>

</body>
</html>
